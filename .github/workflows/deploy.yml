name: Deploy Node.js Backend to EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and validate
        run: |
          npm ci
          node --check server.js

      - name: Prepare deployment package
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=app.tar.gz \
            --warning=no-file-changed \
            -czf app.tar.gz .

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy files to EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            app.tar.gz \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/todo-backend-app.tar.gz"

      - name: Deploy and restart PM2
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'EOF'
          set -e

          APP_DIR="/home/ubuntu/create-todo-backend"

          test -d "$APP_DIR"
          tar -xzf /tmp/todo-backend-app.tar.gz -C "$APP_DIR"
          rm -f /tmp/todo-backend-app.tar.gz

          cd "$APP_DIR"
          npm ci --omit=dev
          pm2 describe todo-backend >/dev/null
          pm2 restart todo-backend --update-env
          pm2 save

          echo "Deployment completed successfully."
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key