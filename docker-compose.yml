services:
  backend:
    build: .
    container_name: todo-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8.0
    container_name: todo-mongodb
    restart: unless-stopped
    environment:
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    volumes:
      - mongodb_data:/data/db
volumes:
  mongodb_data: